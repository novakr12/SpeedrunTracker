services:
  db:
    image: postgres:16-alpine
    container_name: speedrun-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: speedrun
      POSTGRES_PASSWORD: speedrun
      POSTGRES_DB: speedrun
    ports:
      - "5433:5432"
    volumes:
      - speedrun-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speedrun -d speedrun"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  speedrun-data:
